<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Schemer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23b57f1d'/%3E%3Cpolyline points='5 17 10 17 10 8 19 8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
<script defer src="vendor/katex/katex.min.js"></script>
</head>
<body data-tool="select">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M6 3.5 17.5 13l-5.2.9L9.6 19.5Z"/></symbol>
    <symbol id="i-path" viewBox="0 0 24 24"><polyline points="4 19 10 19 10 9 20 9"/><circle cx="4" cy="19" r="1.6" fill="currentColor" stroke="none"/><circle cx="20" cy="9" r="1.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-segment" viewBox="0 0 24 24"><path d="M3 12h18" opacity=".45"/><path d="M8.5 12h7" stroke-width="4.2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><polyline points="4 18 12 18 12 6 20 6"/><rect x="9.7" y="15.7" width="4.6" height="4.6" fill="currentColor" stroke="none" rx="1"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6.5" cy="7" r="2.5"/><circle cx="6.5" cy="17" r="2.5"/><path d="M8.7 8.3 20 16M8.7 15.7 20 8"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M7 10h6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19 17 7M17 7h-6M17 7v6"/></symbol>
    <symbol id="i-draw" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4L9 19H5v-4Z"/><path d="M12.5 7.5l4 4"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></symbol>
    <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="11" rx="2"/></symbol>
    <symbol id="i-aline" viewBox="0 0 24 24"><path d="M5 19 19 5"/></symbol>
    <symbol id="i-aarrow" viewBox="0 0 24 24"><path d="M5 19 18 6M18 6h-5.5M18 6v5.5"/><path d="M18 6l-2.8 6.7L13.3 8.7 8.3 12.7"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 4 9l4 4"/><path d="M4 9h9.5a5.5 5.5 0 1 1 0 11H10"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 5 4 4-4 4"/><path d="M20 9h-9.5a5.5 5.5 0 1 0 0 11H14"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 8v5M8 10.5h5"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M8 10.5h5"/></symbol>
    <symbol id="i-rot-ccw" viewBox="0 0 24 24"><path d="M5.5 8.5A7.5 7.5 0 1 1 4.6 14"/><path d="M5 4v4.5h4.5"/></symbol>
    <symbol id="i-rot-cw" viewBox="0 0 24 24"><path d="M18.5 8.5A7.5 7.5 0 1 0 19.4 14"/><path d="M19 4v4.5h-4.5"/></symbol>
    <symbol id="i-flip-h" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2.4"/><path d="M9 6 3 18h6Z"/><path d="M15 6l6 12h-6Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-flip-v" viewBox="0 0 24 24"><path d="M3 12h18" stroke-dasharray="2 2.4"/><path d="M6 9 18 3v6Z"/><path d="M6 15l12 6v-6Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-al-left" viewBox="0 0 24 24"><path d="M4 3v18"/><rect x="7" y="6" width="13" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="7" y="14" width="8" height="4" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-al-hcenter" viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="8" y="14" width="8" height="4" rx="1" fill="currentColor" stroke="none"/><path d="M12 3v3M12 10v4M12 18v3"/></symbol>
    <symbol id="i-al-right" viewBox="0 0 24 24"><path d="M20 3v18"/><rect x="4" y="6" width="13" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="9" y="14" width="8" height="4" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-al-top" viewBox="0 0 24 24"><path d="M3 4h18"/><rect x="6" y="7" width="4" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="7" width="4" height="8" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-al-vcenter" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="8" width="4" height="8" rx="1" fill="currentColor" stroke="none"/><path d="M3 12h3M10 12h4M18 12h3"/></symbol>
    <symbol id="i-al-bottom" viewBox="0 0 24 24"><path d="M3 20h18"/><rect x="6" y="4" width="4" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="9" width="4" height="8" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-dist-h" viewBox="0 0 24 24"><rect x="3" y="7" width="4" height="10" rx="1" fill="currentColor" stroke="none"/><rect x="10" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="17" y="8.5" width="4" height="7" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-dist-v" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="4" y="10" width="16" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="8.5" y="17" width="7" height="4" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>

</svg>

<header id="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><polyline points="5 17 10 17 10 8 19 8" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <h1>Master Schemer</h1>
  </div>
  <nav class="menubar" id="menubar" aria-label="Main menu">
    <div class="menu">
      <button class="menu-title" aria-haspopup="true" aria-expanded="false">File</button>
      <div class="menu-list" role="menu">
        <button role="menuitem" id="newBtn">New</button>
        <button role="menuitem" id="openBtn">Open…<kbd>Ctrl+O</kbd></button>
        <button role="menuitem" data-act="recent">Open Recent…<kbd>Ctrl+Shift+O</kbd></button>
        <hr>
        <button role="menuitem" id="saveBtn">Save<kbd>Ctrl+S</kbd></button>
        <button role="menuitem" id="saveAsBtn">Save As…<kbd>Ctrl+Shift+S</kbd></button>
        <hr>
        <button role="menuitem" id="exportBtn">Export SVG<kbd>Ctrl+E</kbd></button>
        <button role="menuitem" id="csvBtn">Export CSV</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-title" aria-haspopup="true" aria-expanded="false">Edit</button>
      <div class="menu-list" role="menu">
        <button role="menuitem" data-click="undoBtn">Undo<kbd>Ctrl+Z</kbd></button>
        <button role="menuitem" data-click="redoBtn">Redo<kbd>Ctrl+Shift+Z</kbd></button>
        <hr>
        <button role="menuitem" id="copyBtn">Copy<kbd>Ctrl+C</kbd></button>
        <button role="menuitem" id="pasteBtn">Paste<kbd>Ctrl+V</kbd></button>
        <button role="menuitem" data-act="delete">Delete<kbd>Del</kbd></button>
        <hr>
        <button role="menuitem" data-act="selectAll">Select All<kbd>Ctrl+A</kbd></button>
        <button role="menuitem" data-act="group">Group<kbd>Ctrl+G</kbd></button>
        <button role="menuitem" data-act="ungroup">Ungroup<kbd>Ctrl+Shift+G</kbd></button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-title" aria-haspopup="true" aria-expanded="false">View</button>
      <div class="menu-list" role="menu">
        <button role="menuitem" data-click="zoomIn">Zoom In<kbd>+</kbd></button>
        <button role="menuitem" data-click="zoomOut">Zoom Out<kbd>−</kbd></button>
        <button role="menuitem" data-click="zoomLabel">Actual Size<kbd>0</kbd></button>
        <button role="menuitem" data-click="zoomFit">Fit Scheme<kbd>1</kbd></button>
        <hr>
        <button role="menuitemcheckbox" data-click="snapToggle">Snap to Half-Grid</button>
        <button role="menuitemcheckbox" data-click="dataToggle">Show Data Boxes</button>
        <button role="menuitemcheckbox" data-click="hoverToggle">Data on Hover</button>
        <button role="menuitemcheckbox" data-click="themeToggle">Dark Theme</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-title" aria-haspopup="true" aria-expanded="false">Window</button>
      <div class="menu-list" role="menu">
        <button role="menuitemcheckbox" data-panel="toolbar">Toolbar</button>
        <button role="menuitemcheckbox" data-panel="tools">Tools</button>
        <button role="menuitemcheckbox" data-panel="objects">Objects</button>
        <button role="menuitemcheckbox" data-panel="library">Library</button>
        <button role="menuitemcheckbox" data-panel="color">Color</button>
        <button role="menuitemcheckbox" data-panel="props">Properties</button>
        <button role="menuitemcheckbox" data-panel="notes">Notes</button>
        <hr>
        <button role="menuitem" data-act="showPanels">Show All Panels</button>
        <button role="menuitem" data-act="hidePanels">Hide All Panels<kbd>Shift+Tab</kbd></button>
      </div>
    </div>
  </nav>
  <div class="topbar-group">
    <button class="icon-btn" id="undoBtn" data-tip="Undo (Ctrl+Z)" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
    <button class="icon-btn" id="redoBtn" data-tip="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg><use href="#i-redo"/></svg></button>
  </div>
  <div class="topbar-group" id="zoomGroup">
    <button class="icon-btn" id="zoomOut" data-tip="Zoom out (−)" aria-label="Zoom out"><svg><use href="#i-zoom-out"/></svg></button>
    <button class="btn zoom-label" id="zoomLabel" data-tip="Reset to 100% (0)">100%</button>
    <button class="icon-btn" id="zoomIn" data-tip="Zoom in (+)" aria-label="Zoom in"><svg><use href="#i-zoom-in"/></svg></button>
    <button class="icon-btn" id="zoomFit" data-tip="Fit scheme (1)" aria-label="Fit scheme in view"><svg><use href="#i-fit"/></svg></button>
  </div>
</header>

<nav id="ctrlbar" aria-label="Arrange toolbar">
  <div class="topbar-group">
    <button class="icon-btn" data-xf="ccw" data-tip="Rotate 90° counter-clockwise" aria-label="Rotate 90° counter-clockwise"><svg><use href="#i-rot-ccw"/></svg></button>
    <button class="icon-btn" data-xf="cw" data-tip="Rotate 90° clockwise" aria-label="Rotate 90° clockwise"><svg><use href="#i-rot-cw"/></svg></button>
    <button class="icon-btn" data-xf="h" data-tip="Flip horizontal" aria-label="Flip horizontal"><svg><use href="#i-flip-h"/></svg></button>
    <button class="icon-btn" data-xf="v" data-tip="Flip vertical" aria-label="Flip vertical"><svg><use href="#i-flip-v"/></svg></button>
  </div>
  <div class="topbar-group">
    <button class="icon-btn" data-align="left" data-tip="Align left edges" aria-label="Align left edges"><svg><use href="#i-al-left"/></svg></button>
    <button class="icon-btn" data-align="hcenter" data-tip="Align horizontal centers" aria-label="Align horizontal centers"><svg><use href="#i-al-hcenter"/></svg></button>
    <button class="icon-btn" data-align="right" data-tip="Align right edges" aria-label="Align right edges"><svg><use href="#i-al-right"/></svg></button>
    <button class="icon-btn" data-align="top" data-tip="Align top edges" aria-label="Align top edges"><svg><use href="#i-al-top"/></svg></button>
    <button class="icon-btn" data-align="vcenter" data-tip="Align vertical centers" aria-label="Align vertical centers"><svg><use href="#i-al-vcenter"/></svg></button>
    <button class="icon-btn" data-align="bottom" data-tip="Align bottom edges" aria-label="Align bottom edges"><svg><use href="#i-al-bottom"/></svg></button>
  </div>
  <div class="topbar-group">
    <button class="icon-btn" data-dist="h" data-tip="Distribute horizontally (3+ objects)" aria-label="Distribute horizontally (3+ objects)"><svg><use href="#i-dist-h"/></svg></button>
    <button class="icon-btn" data-dist="v" data-tip="Distribute vertically (3+ objects)" aria-label="Distribute vertically (3+ objects)"><svg><use href="#i-dist-v"/></svg></button>
  </div>
</nav>

<aside id="toolrail" role="toolbar" aria-label="Drawing tools" aria-orientation="vertical">
  <button class="tool-btn" data-tool="select" data-tip="Select — V" aria-label="Select tool"><svg><use href="#i-select"/></svg></button>
  <div class="rail-label" role="presentation">Model</div>
  <button class="tool-btn" data-tool="path" data-tip="Line — L" aria-label="Line tool"><svg><use href="#i-path"/></svg></button>
  <button class="tool-btn" data-tool="segment" data-tip="Segment — S" aria-label="Segment tool"><svg><use href="#i-segment"/></svg></button>
  <button class="tool-btn" data-tool="edit" data-tip="Edit line — E" aria-label="Edit line tool"><svg><use href="#i-edit"/></svg></button>
  <button class="tool-btn" data-tool="cut" data-tip="Cut — X" aria-label="Cut tool"><svg><use href="#i-cut"/></svg></button>
  <button class="tool-btn" data-tool="card" data-tip="Card — C" aria-label="Card tool"><svg><use href="#i-card"/></svg></button>
  <button class="tool-btn" data-tool="arrow" data-tip="Connect — A" aria-label="Connect tool"><svg><use href="#i-arrow"/></svg></button>
  <div class="rail-label" role="presentation">Notes</div>
  <button class="tool-btn" data-tool="draw" data-tip="Freehand — D" aria-label="Freehand tool"><svg><use href="#i-draw"/></svg></button>
  <button class="tool-btn" data-tool="text" data-tip="Note · $math$ — T" aria-label="Note tool"><svg><use href="#i-text"/></svg></button>
  <button class="tool-btn" data-tool="ellipse" data-tip="Ellipse — O" aria-label="Ellipse tool"><svg><use href="#i-ellipse"/></svg></button>
  <button class="tool-btn" data-tool="rect" data-tip="Rectangle — B" aria-label="Rectangle tool"><svg><use href="#i-rect"/></svg></button>
  <button class="tool-btn" data-tool="aline" data-tip="Free line — N" aria-label="Free line tool"><svg><use href="#i-aline"/></svg></button>
  <button class="tool-btn" data-tool="aarrow" data-tip="Free arrow — R" aria-label="Free arrow tool"><svg><use href="#i-aarrow"/></svg></button>
  <div class="rail-rule" role="separator"></div>
  <button class="tool-btn" data-tool="hand" data-tip="Pan — H or Space" aria-label="Pan tool"><svg><use href="#i-hand"/></svg></button>
</aside>

<aside id="sidebar" aria-label="Objects">
  <div class="side-head side-head-obj">Objects</div>
  <div id="sidebarBody"></div>
  <div class="side-head side-head-lib">Library</div>
  <div id="libraryBody"></div>
</aside>

<main id="canvasWrap">
  <svg id="canvas">
    <defs>
      <pattern id="gridDots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="0" cy="0" r="1" fill="#d8d2c6"/>
        <circle cx="20" cy="0" r="1" fill="#d8d2c6"/>
        <circle cx="0" cy="20" r="1" fill="#d8d2c6"/>
        <circle cx="20" cy="20" r="1" fill="#d8d2c6"/>
      </pattern>
      <marker id="arrowHead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0.5 9 5 0 9.5z" fill="#55504a"/>
      </marker>
      <marker id="arrowHeadSel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0.5 9 5 0 9.5z" fill="#b57f1d"/>
      </marker>
      <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#3a3020" flood-opacity="0.13"/>
      </filter>
      <filter id="glowBlur" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
    </defs>
    <g id="world">
      <rect id="gridRect" fill="url(#gridDots)"/>
      <g id="layer-cards"></g>
      <g id="layer-links"></g>
      <g id="layer-draw"></g>
      <g id="layer-overlay"></g>
      <g id="layer-preview"></g>
    </g>
  </svg>
  <div id="mathLayer" aria-hidden="true"></div>
  <div id="dataLayer" aria-hidden="true"></div>
</main>

<aside id="panel" aria-label="Properties">
  <div id="panelBody"></div>
</aside>

<aside id="notesPanel" aria-label="Notes">
  <div class="notes-head">
    <span>Notes</span>
    <button class="icon-btn notes-hide" id="notesHide" data-tip="Hide notes" aria-label="Hide notes">×</button>
  </div>
  <div id="notesEditor" contenteditable="true" spellcheck="true"
       data-ph="Write notes in Markdown. Drag an object here — from the list or the canvas — to drop in a live reference to its name."></div>
</aside>

<footer id="statusbar">
  <span id="hint"></span>
  <span class="status-right">
    <button class="status-toggle" id="snapToggle" aria-pressed="true" data-tip="Snap annotation shapes to the half-grid">Snap</button>
    <button class="status-toggle" id="dataToggle" aria-pressed="false" data-tip="Show every object's data box">Data</button>
    <button class="status-toggle" id="hoverToggle" aria-pressed="false" data-tip="Show an object's data when you hover it">Data on hover</button>
    <button class="status-toggle" id="notesToggle" aria-pressed="true" data-tip="Show or hide the notes panel">Notes</button>
    <button class="status-toggle" id="themeToggle" aria-pressed="false" data-tip="Switch between the light and dark interface">Dark</button>
    <span id="coords">0, 0</span>
  </span>
</footer>

<input type="file" id="fileInput" accept=".json,application/json" hidden>
<input type="file" id="libInput" accept=".json,application/json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
